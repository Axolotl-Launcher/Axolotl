[env]
# The linker flag above only covers the main thread, and the launcher raises
# the stack again for its tokio runtime (apps/app/src/main.rs). Test threads
# get neither, so the heaviest tests abort with STATUS_STACK_OVERFLOW
# (0xc00000fd) on their deep async chains instead of reporting a real result.
# This gives them the same headroom as the app. Cargo applies [env] to every
# process it launches, so a dev run gets it too, which only repeats the stack
# the launcher already gives its own runtime. It is a runtime variable that the
# standard library reads when it sizes a thread, so the shipped binary is
# unaffected unless something sets it. The value is fixed here rather than read
# from the environment so the fingerprint is identical on every machine; a value
# that varies would keep build scripts permanently dirty.
RUST_MIN_STACK = "16777216"

# Windows has stack overflows when calling from Tauri, so we increase the default stack size used by the compiler
[target."cfg(windows)"]
rustflags = ["-C", "link-args=/STACK:16777220"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# MODRINTH_* service URLs are intentionally NOT set here. They used to live in
# [env] as public defaults, but Cargo fingerprints those process-env values
# while app-lib build.rs bakes a different value from packages/app-lib/.env
# via rustc-env for env!(). That mismatch kept `theseus` permanently dirty.
# build.rs now owns the single resolution chain: .env → process env → public
# defaults.
