name: Agent PR Review

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.body == '/code-review'
        && github.event.comment.user.type != 'Bot'
        && contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association
        )
      )
    runs-on: ubuntu-latest

    concurrency:
      group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Resolve PR context for comment trigger
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Run review agent
        uses: alibaba/open-code-review@v1.12.11
        with:
          ocr_version: '1.12.11'
          llm_url: https://codeflow.sh/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_TOKEN }}
          llm_model: gpt-6.1-sol
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: Chinese
          sticky_summary: 'true'
          incremental: 'true'
          pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
