name: Axolotl desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI_SCOPE_PROTOCOL: cumulative-v1

permissions:
  contents: read

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      frontend: ${{ steps.scope.outputs.frontend }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Determine checks since the last successful CI
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/axolotl/ci-changes.mjs

  guardrails:
    name: Run guardrails checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rustfmt
        run: rustup component add rustfmt
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/axolotl/ci-changes.test.mjs
          node --test scripts/axolotl/build-jobs.test.mjs
          node --test scripts/axolotl/rust-coverage.test.mjs
          node --test scripts/axolotl/check-db-test-isolation.test.mjs
          node --test scripts/axolotl/release-policy.test.mjs
          node --test scripts/axolotl/aliyunoss-release.test.mjs
          node --test scripts/axolotl/set-version.test.mjs
          node --test scripts/axolotl/update-manifest.test.mjs scripts/axolotl/finalize-github-release.test.mjs scripts/axolotl/publish-update-server.test.mjs scripts/axolotl/cnb-release.test.mjs scripts/axolotl/gitlink-release.test.mjs scripts/axolotl/create-website-release-metadata.test.mjs
          node scripts/axolotl/create-update-server-catalog.test.mjs
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release
      - name: Check brand guidelines
        run: node scripts/axolotl/brand-guard.mjs
      - name: Check agents
        run: node scripts/axolotl/check-agents.mjs
      - name: Check internationalization
        run: node scripts/axolotl/i18n-check.mjs
      - name: Check CSS variables
        run: node scripts/axolotl/check-css-vars.mjs
      - name: Check orphan components
        run: node scripts/axolotl/check-orphan-components.mjs
      - name: Check scoped styles
        run: node scripts/axolotl/check-scoped-styles.mjs
      - name: Check retired UI
        run: node scripts/axolotl/check-retired-ui.mjs
      - name: Check dead colours
        run: node scripts/axolotl/check-dead-colours.mjs
      - name: Check dead colours (tests)
        run: node scripts/axolotl/check-dead-colours.test.mjs
      - name: Check downgrade for app database
        run: node scripts/axolotl/downgrade-app-db.test.mjs
      - name: Check database test isolation
        run: node scripts/axolotl/check-db-test-isolation.mjs
      - name: Check release notes
        run: node --test scripts/axolotl/create-release-notes.test.mjs
      - name: Check Discord release notifications
        run: node --test scripts/axolotl/publish-discord-release.test.mjs
      - name: Check scheduler resource gates
        # Blocking since the scheduler policy is part of the tree: a new lock,
        # spawn or std::fs site fails until its policy entry lands, and a stale
        # rank fingerprint fails until it is re-reviewed.
        # Every gate runs even after one fails; the step fails at the end and
        # names each failed gate.
        run: |
          failed=()
          # Usage: gate <highest accepted exit code> <command...>
          gate() {
            local accepted=$1 status=0
            shift
            "$@" || status=$?
            if [ "$status" -gt "$accepted" ]; then
              failed+=("$* (exit $status)")
              echo "::error::scheduler gate failed: $* (exit $status)"
            fi
          }
          gate 0 node scripts/axolotl/sched-resource-inventory.mjs
          gate 0 node scripts/axolotl/sched-resource-golden-check.mjs
          gate 0 node --test scripts/axolotl/sched-resource-fixtures.test.mjs scripts/axolotl/sched-gates.test.mjs
          gate 0 node scripts/axolotl/sched-resource-consistency-check.mjs
          gate 0 node scripts/axolotl/sched-leaf-primitive-check.mjs
          gate 0 node scripts/axolotl/sched-l0-resource-check.mjs
          gate 0 node scripts/axolotl/sched-level-predicate-check.mjs
          gate 0 node scripts/axolotl/sched-bare-spawn-check.mjs
          gate 0 node scripts/axolotl/sched-whitelist-check.mjs
          gate 0 node scripts/axolotl/sched-enter-ban-check.mjs
          gate 0 node scripts/axolotl/sched-tag-check.mjs
          gate 0 node scripts/axolotl/sched-unbounded-sender-check.mjs
          # Exit 1 here means the design falls back to per-family orders (an
          # accepted outcome, spec §11.8 R5); only other codes fail.
          gate 1 node scripts/axolotl/sched-recall-gap-gate.mjs
          # Within each family the order is enforced: every acquisition point
          # the per-family order can judge must carry an annotation.
          gate 0 node scripts/axolotl/sched-order-annotation-check.mjs --require-annotations
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'failed scheduler gates:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Check formatting of Rust code
        run: cargo fmt --all --check

  # The frontend lint and test suites were previously never run in CI, so
  # design-system regressions (duplicate components, boundary violations,
  # broken tests) could merge silently.
  frontend:
    name: Run frontend lint and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser for visual tests
        run: pnpm --filter @modrinth/ui exec playwright install --with-deps chromium
      - name: Lint frontend packages
        run: |
          pnpm --filter @modrinth/ui lint
          pnpm --filter @modrinth/app-frontend lint
          pnpm --filter @modrinth/assets lint
          pnpm --filter @modrinth/utils lint
          pnpm --filter @modrinth/server lint
          pnpm --filter @modrinth/api-client lint
          pnpm --filter @modrinth/tooling-config lint
          pnpm --filter @axolotl/website lint
      - name: Test shared UI package
        run: pnpm --filter @modrinth/ui test
      - name: Test desktop frontend
        run: pnpm --filter @modrinth/app-frontend test

  frontend-e2e:
    name: Test desktop frontend user flows
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser system dependencies
        run: pnpm --filter @modrinth/app-frontend exec playwright install-deps chromium
      - name: Test desktop navigation and persisted appearance
        run: |
          set -o pipefail
          mkdir -p .agents/plans/desktop-e2e
          pnpm --filter @modrinth/app-frontend test:e2e 2>&1 | tee .agents/plans/desktop-e2e/run.log
      - name: Upload desktop E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-frontend-e2e-failure
          path: |
            .agents/plans/desktop-e2e/*.log
            .agents/plans/desktop-e2e/*.json
            .agents/plans/desktop-e2e/*.png
            .agents/plans/desktop-e2e/webdriver/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  resources:
    name: Prepare build resources
    needs: [changes, guardrails]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs
      - name: Test Java agent cache and offline behavior
        run: node --test scripts/axolotl/java-build.test.mjs
      - name: Upload build resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  desktop:
    name: Build and test desktop application
    needs: [changes, guardrails, resources]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      # The desktop app runs its async workload on 16 MiB worker stacks
      # (see apps/app/src/main.rs), while the resource export tests need more
      # than that in the debug test harness.
      RUST_MIN_STACK: 67108864
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: ci
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest@0.9.150
      - name: Set frontend target for reusable build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows ;;
            macOS) platform=darwin ;;
            Linux) platform=linux ;;
          esac
          echo "TAURI_ENV_PLATFORM=$platform" >> "$GITHUB_ENV"
      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend
      - name: Check for dead alpha utilities
        run: node scripts/axolotl/check-dead-utilities.mjs
      - name: Test version metadata writes
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail writing_version_info_creates_missing_parent_directory
      - name: Test launcher memory behavior
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail api::memory
      # Runs the CurseForge content pipeline suites (recognition, dependency
      # selection, install, verification, manual downloads, reconciliation).
      # Linux only: the code is platform independent and this keeps the matrix
      # cost to one extra test binary run.
      - name: Test CurseForge content pipeline
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail curseforge
      # The rebuildable database: an unknown migration version and an
      # unreadable file both leave it disabled, keeping the file, without
      # failing startup. Hermetic (temp dirs + sqlite).
      - name: Test derived database
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail derived_db
      - name: Test app database ownership and recovery
        run: |
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::db::
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::db_backup::
      - name: Test Java availability and external storage selection
        run: |
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail api::jre::tests::
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail documents::java::
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail java_storage::
      # The settings documents: a document answers for its domain, and a key it
      # leaves out stays at its default instead of returning to the row.
      # Hermetic (in-memory sqlite + temp dirs).
      - name: Test settings documents
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::documents
      # The store collections: every record the launcher keeps between runs, a
      # suite per collection. These suites were in no filter at all, so they
      # went three months with foreign-key and assertion failures nobody saw.
      # Hermetic (in-memory sqlite + temp dirs); Linux only for matrix cost.
      - name: Test the store collections
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::store::tests
      # The scheduler: tags and their cap, the L0 executor, queue, quiesce,
      # supervision, the critical-section API and telemetry reconciliation.
      # Hermetic (timers, temp dirs, in-memory sqlite); Linux only for matrix
      # cost. These suites were in no filter, so the Node gates were the only
      # thing watching the scheduler.
      - name: Test the scheduler
        if: runner.os == 'Linux'
        run: |
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail scheduler::
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail install::critical_section
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail telemetry::reconcile
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::process::playtime_clock
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::process::l0_separation_tests
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail state::process::stopped_detector_tests
      # The account secrets: a row keeps a secret the credential store will not
      # take, and moving the rows into the store keeps the rows it already moved.
      # Hermetic (in-memory sqlite, and a store substituted for the platform's).
      - name: Test account secrets
        if: runner.os == 'Linux'
        run: |
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail store::tests::secrets
          cargo nextest run --package theseus --no-fail-fast --no-tests=fail marks_whose_account_secrets_were_moved
      # The refresh state lives in the derived database now, so deleting an
      # instance has to take its rows with it: the guard is the deletion step.
      - name: Test refresh state
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail content_refresh
      - name: Test instance deletion
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail remove_instance
      # Provider-neutral resource layer: catalog, plans, execution, providers.
      # Hermetic (in-memory sqlite + temp dirs); Linux only for matrix cost.
      - name: Test provider-neutral resource layer
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail resources
      - name: Test Java build fingerprints
        if: runner.os == 'Linux'
        run: cargo nextest run --package theseus --no-fail-fast --no-tests=fail --test java_build_cache
      - run: cargo check --package theseus_gui --features updater
      # .cargo/config.toml links Linux builds with mold, and mold stamps its
      # version into .comment. This fails if another linker made the binaries.
      - name: Verify mold linked the Linux test binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t binaries < <(find target/debug/deps -maxdepth 1 -type f -executable -name 'theseus-*')
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo 'No theseus test binaries to inspect' >&2
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            comment="$(readelf --string-dump=.comment "$binary")"
            if [[ "$comment" != *'mold '* ]]; then
              echo "$binary was not linked by mold:" >&2
              echo "$comment" >&2
              exit 1
            fi
          done
          echo "mold linked ${#binaries[@]} theseus test binaries"
      - name: Test Windows installer UI and core
        if: runner.os == 'Windows'
        run: |
          cargo test --package axolotl-installer-ui
          pnpm --filter @modrinth/app-frontend exec playwright install chromium
          node --test apps/installer-ui/tests/installer-ui.test.cjs
      - name: Compile Windows application and installer UI without release optimization
        if: runner.os == 'Windows'
        run: |
          node scripts/axolotl/build-desktop.mjs --profile ci
          node scripts/axolotl/build-desktop.mjs --profile ci --installer-only
      - name: Test transactional Windows executable updates
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AXOLOTL_INSTALLER_UI_PATH: ${{ github.workspace }}/target/ci/axolotl-installer-ui.exe
        run: node --test apps/installer-ui/tests/executable-install.test.cjs apps/installer-ui/tests/portable-update.test.cjs
      - name: Package and verify both Windows installers from one binary
        if: runner.os == 'Windows'
        run: node scripts/axolotl/package-windows.mjs --profile ci --output target/ci-installers
      - name: Test actual Windows uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix target/uninstall-verification --no-save --no-audit --no-fund handlebars@4.7.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare NSIS fixture dependencies" }
          node apps/installer-ui/tests/compile-fixture.cjs --tauri-nsis target/ci-bundle/release/nsis/x64 --installer-helper target/ci/axolotl-installer-ui.exe
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile NSIS uninstall fixture" }
          & apps/installer-ui/tests/uninstall-smoke.ps1
  website:
    name: Build website (${{ matrix.nitro-preset }})
    needs: [changes, guardrails]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nitro-preset: [static, cloudflare-module]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test website
        run: pnpm --filter @axolotl/website test
      - name: Build website
        env:
          NITRO_PRESET: ${{ matrix.nitro-preset }}
        run: pnpm --filter @axolotl/website build

  # Reports Rust line coverage for the whole workspace. A single OS keeps the
  # cost near the existing matrix while still measuring every crate, which the
  # filtered `cargo test` steps in the desktop job never do.
  #
  # The floor is a ratchet, not the 75% goal: the first measured baseline was
  # 59.97%, so the gate holds just under it and rises as tests are added. Raise
  # it; never lower it to make a change pass.
  coverage:
    name: Measure Rust coverage
    needs: [changes, guardrails, resources]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
      # Instrumented tests reach the same deep async chains as the desktop job.
      RUST_MIN_STACK: 67108864
      COVERAGE_MIN_LINES: '59'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: ci
      - name: Install coverage tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.150
      # cargo-llvm-cov shells out to llvm-cov and llvm-profdata from this component.
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Measure coverage
        run: |
          node scripts/axolotl/rust-coverage.mjs \
            --keep-report-on-test-fail --fail-under "$COVERAGE_MIN_LINES"
      # The gate fails after the reports are written, so the artifacts below
      # still publish the evidence for a red run.
      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('target/coverage/total.txt') != '' }}
        run: |
          summary="$(cat target/coverage/total.txt)"
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('target/coverage/total.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/
          retention-days: 7
          if-no-files-found: error

  desktop-ci-result:
    name: Desktop CI result
    # Report failed checks, but skip the gate when a newer run cancels this workflow.
    if: ${{ !cancelled() }}
    needs: [changes, guardrails, frontend, resources, desktop, coverage, website]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/axolotl/ci-result.mjs
