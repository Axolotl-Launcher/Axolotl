name: Axolotl desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI_SCOPE_PROTOCOL: cumulative-v1

permissions:
  contents: read

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      frontend: ${{ steps.scope.outputs.frontend }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Determine checks since the last successful CI
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/axolotl/ci-changes.mjs

  guardrails:
    name: Run guardrails checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rustfmt
        run: rustup component add rustfmt
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/axolotl/ci-changes.test.mjs
          node --test scripts/axolotl/release-policy.test.mjs
          node --test scripts/axolotl/aliyunoss-release.test.mjs
          node --test scripts/axolotl/set-version.test.mjs
          node --test scripts/axolotl/update-manifest.test.mjs scripts/axolotl/finalize-github-release.test.mjs scripts/axolotl/publish-update-server.test.mjs scripts/axolotl/cnb-release.test.mjs scripts/axolotl/gitlink-release.test.mjs scripts/axolotl/create-website-release-metadata.test.mjs
          node scripts/axolotl/create-update-server-catalog.test.mjs
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release
      - name: Check brand guidelines
        run: node scripts/axolotl/brand-guard.mjs
      - name: Check agents
        run: node scripts/axolotl/check-agents.mjs
      - name: Check internationalization
        run: node scripts/axolotl/i18n-check.mjs
      - name: Check CSS variables
        run: node scripts/axolotl/check-css-vars.mjs
      - name: Check orphan components
        run: node scripts/axolotl/check-orphan-components.mjs
      - name: Check scoped styles
        run: node scripts/axolotl/check-scoped-styles.mjs
      - name: Check retired UI
        run: node scripts/axolotl/check-retired-ui.mjs
      - name: Check dead colours
        run: node scripts/axolotl/check-dead-colours.mjs
      - name: Check dead colours (tests)
        run: node scripts/axolotl/check-dead-colours.test.mjs
      - name: Check downgrade for app database
        run: node scripts/axolotl/downgrade-app-db.test.mjs
      - name: Check release notes
        run: node --test scripts/axolotl/create-release-notes.test.mjs
      - name: Check Discord release notifications
        run: node --test scripts/axolotl/publish-discord-release.test.mjs
      - name: Check formatting of Rust code
        run: cargo fmt --all --check

  # The frontend lint and test suites were previously never run in CI, so
  # design-system regressions (duplicate components, boundary violations,
  # broken tests) could merge silently.
  frontend:
    name: Run frontend lint and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser for visual tests
        run: pnpm --filter @modrinth/ui exec playwright install --with-deps chromium
      - name: Lint frontend packages
        run: |
          pnpm --filter @modrinth/ui lint
          pnpm --filter @modrinth/app-frontend lint
          pnpm --filter @modrinth/assets lint
          pnpm --filter @modrinth/utils lint
          pnpm --filter @modrinth/server lint
          pnpm --filter @modrinth/api-client lint
          pnpm --filter @modrinth/tooling-config lint
          pnpm --filter @axolotl/website lint
      - name: Test shared UI package
        run: pnpm --filter @modrinth/ui test
      - name: Test desktop frontend
        run: pnpm --filter @modrinth/app-frontend test
      - name: Test desktop frontend overlays
        run: pnpm --filter @modrinth/app-frontend test:visual

  resources:
    name: Prepare build resources
    needs: [changes, guardrails]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs
      - name: Test Java agent cache and offline behavior
        run: node --test scripts/axolotl/java-build.test.mjs
      - name: Upload build resources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  desktop:
    name: Build and test desktop application
    needs: [changes, guardrails, resources]
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      # The desktop app runs its async workload on 16 MiB worker stacks
      # (see apps/app/src/main.rs); test threads default to 2 MiB and the
      # CurseForge install pipeline is deep enough to overflow that.
      RUST_MIN_STACK: 16777216
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup desktop build
        uses: ./.github/actions/setup-desktop-build
        with:
          profile: ci
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set frontend target for reusable build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows ;;
            macOS) platform=darwin ;;
            Linux) platform=linux ;;
          esac
          echo "TAURI_ENV_PLATFORM=$platform" >> "$GITHUB_ENV"
      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend
      - name: Check for dead alpha utilities
        run: node scripts/axolotl/check-dead-utilities.mjs
      - name: Test version metadata writes
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      # Runs the CurseForge content pipeline suites (recognition, dependency
      # selection, install, verification, manual downloads, reconciliation).
      # Linux only: the code is platform independent and this keeps the matrix
      # cost to one extra test binary run.
      - name: Test CurseForge content pipeline
        if: runner.os == 'Linux'
        run: cargo test --package theseus curseforge
      # Provider-neutral resource layer: catalog, plans, execution, providers.
      # Hermetic (in-memory sqlite + temp dirs); Linux only for matrix cost.
      - name: Test provider-neutral resource layer
        if: runner.os == 'Linux'
        run: cargo test --package theseus resources
      - name: Test Java build fingerprints
        if: runner.os == 'Linux'
        run: cargo test --package theseus --test java_build_cache
      - run: cargo check --package theseus_gui --features updater
      - name: Test Windows installer UI and core
        if: runner.os == 'Windows'
        run: |
          cargo test --package axolotl-installer-ui
          pnpm --filter @modrinth/app-frontend exec playwright install chromium
          node --test apps/installer-ui/tests/installer-ui.test.cjs
      - name: Compile Windows application and installer UI without release optimization
        if: runner.os == 'Windows'
        run: |
          node scripts/axolotl/build-desktop.mjs --profile ci
          node scripts/axolotl/build-desktop.mjs --profile ci --installer-only
      - name: Package and verify both Windows installers from one binary
        if: runner.os == 'Windows'
        run: node scripts/axolotl/package-windows.mjs --profile ci --output target/ci-installers
      - name: Test actual Windows uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix target/uninstall-verification --no-save --no-audit --no-fund handlebars@4.7.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare NSIS fixture dependencies" }
          node apps/installer-ui/tests/compile-fixture.cjs --tauri-nsis target/ci-bundle/release/nsis/x64
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile NSIS uninstall fixture" }
          & apps/installer-ui/tests/uninstall-smoke.ps1
  website:
    name: Build website (${{ matrix.nitro-preset }})
    needs: [changes, guardrails]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nitro-preset: [static, cloudflare-module]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test website
        run: pnpm --filter @axolotl/website test
      - name: Build website
        env:
          NITRO_PRESET: ${{ matrix.nitro-preset }}
        run: pnpm --filter @axolotl/website build

  desktop-ci-result:
    name: Desktop CI result
    # Report failed checks, but skip the gate when a newer run cancels this workflow.
    if: ${{ !cancelled() }}
    needs: [changes, guardrails, frontend, resources, desktop, website]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/axolotl/ci-result.mjs
