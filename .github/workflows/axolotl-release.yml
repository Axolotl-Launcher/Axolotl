name: Axolotl release

on:
  push:
    tags:
      - 'v*'
      - '!v1.9.9'

permissions:
  contents: write

concurrency:
  group: axolotl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned formatting toolchain
        run: rustup component add rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release guardrails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test scripts/axolotl/release-policy.test.mjs
          node --test scripts/axolotl/set-version.test.mjs
          node scripts/axolotl/check-migrations.mjs --release
          node scripts/axolotl/brand-guard.mjs
          node scripts/axolotl/i18n-check.mjs
          node --test scripts/axolotl/create-release-notes.test.mjs
          cargo fmt --all --check

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/axolotl-release-notes.md"
          node scripts/axolotl/create-release-notes.mjs "${GITHUB_REF_NAME}" "$release_notes"
          existing_release="$(
            gh release list --limit 100 --json tagName \
              --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .tagName"
          )"
          if [[ -n "$existing_release" ]]; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "Axolotl Launcher ${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}"

      - name: Prepare shared build resources
        env:
          AXOLOTL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/sync-contributors.mjs
          node scripts/axolotl/prepare-build-resources.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-resources
          path: target/build-resources/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: Windows x64
            runner: windows-2025
            platform: windows
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
      - name: Reserve Linux ARM64 swap for full LTO
        if: matrix.runner == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          available=$(df --output=avail -B1 "$RUNNER_TEMP" | awk 'NR == 2 { print $1 }')
          required=$((14 * 1024 * 1024 * 1024))
          if [ "$available" -lt "$required" ]; then
            echo 'Insufficient disk space for ARM64 release swap' >&2
            exit 1
          fi
          swap_file="$RUNNER_TEMP/axolotl-release.swap"
          sudo fallocate -l 12G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
      - name: Set release version
        run: node scripts/axolotl/set-version.mjs "${{ github.ref_name }}"
      - name: Compile application once with full LTO
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/axolotl/build-desktop.mjs --profile release
      - name: Compile Windows installer UI
        if: runner.os == 'Windows'
        run: node scripts/axolotl/build-desktop.mjs --profile release --installer-only
      - name: Package release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            node scripts/axolotl/package-windows.mjs --profile release --output target/release-assets/upload
          else
            pnpm --filter @modrinth/app tauri bundle --ci --config tauri-release.conf.json --config tauri-updater.conf.json
            node scripts/axolotl/stage-release-assets.mjs --input target/release/bundle --output target/release-assets/upload --platform linux
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node scripts/axolotl/upload-release-assets.mjs "$GITHUB_REF_NAME" target/release-assets/upload

  macos-build:
    name: Compile macOS (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
          target: ${{ matrix.target }}
      - run: node scripts/axolotl/set-version.mjs "${{ github.ref_name }}"
      - name: Compile native macOS binary with full LTO
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/axolotl/build-desktop.mjs --profile release --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.target }}
          overwrite: true
          path: |
            target/${{ matrix.target }}/release/Axolotl Launcher
            target/${{ matrix.target }}/release/axolotl-build.json
          retention-days: 7
          if-no-files-found: error

  macos-universal:
    name: Package macOS universal
    needs: [preflight, macos-build]
    runs-on: macos-15
    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_RELEASE_LTO: 'true'
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-desktop-build
        with:
          profile: release
          package-only: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-aarch64-apple-darwin
          path: target/macos-input/aarch64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-x86_64-apple-darwin
          path: target/macos-input/x86_64-apple-darwin
      - run: node scripts/axolotl/set-version.mjs "${{ github.ref_name }}"
      - name: Merge architectures and package signed updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/axolotl/package-macos-universal.mjs
          node scripts/axolotl/stage-release-assets.mjs --input target/universal-apple-darwin/release/bundle --output target/release-assets/upload --platform macos
      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/axolotl/upload-release-assets.mjs "$GITHUB_REF_NAME" target/release-assets/upload

  verify-and-publish:
    name: Verify and publish
    needs: [build, macos-universal]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --pattern '*.sig' --dir release-check/signatures

      - name: Download release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id"
          )"
          if [[ -z "$release_id" ]]; then
            echo "Release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-check/release.json

      - name: Generate update manifest
        run: node scripts/axolotl/create-update-manifest.mjs release-check/release.json release-check/signatures "${GITHUB_REF_NAME}" release-check/latest.json

      - name: Verify update manifest
        run: node scripts/axolotl/verify-update-manifest.mjs release-check/latest.json "${GITHUB_REF_NAME}"

      - name: Upload update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-check/latest.json --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi

      - name: Refresh published GitHub release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id"
          )"
          if [[ -z "$release_id" ]]; then
            echo "Published release ${GITHUB_REF_NAME} was not found"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-check/release.json

      - name: Build Update Server artifact catalog
        run: |
          node scripts/axolotl/create-update-server-catalog.mjs \
            release-check/release.json \
            "${GITHUB_REF_NAME}" \
            release-check/update-server-catalog.json
          node scripts/axolotl/create-update-server-catalog.test.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-release-metadata
          path: release-check/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  notify-update-server:
    needs: verify-and-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Notify Update Server to publish release assets
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_SERVER_WEBHOOK_SECRET: ${{ secrets.UPDATE_SERVER_WEBHOOK_SECRET }}
          UPDATE_SERVER_FORCE_UPDATE: 'false'
        run: |
          node scripts/axolotl/publish-update-server.mjs \
            release-check/update-server-catalog.json \
            release-check/release.json \
            "${GITHUB_REF_NAME}"

  publish-website:
    name: Build and deploy website to Netlify
    needs: verify-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - name: Check Netlify deployment credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo '::error::Configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets. See apps/website/README.md.'
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Check out website publication branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: website-publish
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - name: Generate website release data from the release tag
        run: |
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            node scripts/axolotl/create-website-release-metadata.mjs \
              release-check/release.json \
              website-publish/apps/website/releases/latest.json
          fi

          node scripts/axolotl/create-website-release-catalog.mjs \
            website-publish/apps/website/releases/catalog.json

      - name: Install website dependencies
        working-directory: website-publish
        run: pnpm install --frozen-lockfile --filter @axolotl/website...
      - name: Generate static website on GitHub
        working-directory: website-publish
        run: pnpm --filter @axolotl/website build
      - name: Verify prerendered release notes
        working-directory: website-publish
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          const catalog = JSON.parse(fs.readFileSync('apps/website/releases/catalog.json', 'utf8'))
          assert(catalog.announcements.some((entry) => entry.version === version), `Missing catalog entry: ${version}`)
          const html = fs.readFileSync('apps/website/.output/public/changelog/index.html', 'utf8')
          assert(html.includes(version), `Release ${version} was not prerendered`)
          assert(fs.existsSync('apps/website/.output/public/index.html'), 'Missing website homepage')
          NODE
      - name: Save static website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-static-${{ github.ref_name }}
          path: website-publish/apps/website/.output/public/
          retention-days: 7
          if-no-files-found: error
      - name: Sync generated release data to main
        run: |
          git -C website-publish config user.name "Axolotl Release Bot"
          git -C website-publish config user.email "release@axolotl.local"
          git -C website-publish add apps/website/releases/latest.json apps/website/releases/catalog.json
          if git -C website-publish diff --cached --quiet; then
            echo "Website release data is unchanged"
          else
            git -C website-publish commit -m "chore(website): update release data for ${GITHUB_REF_NAME} [skip ci]"
            git -C website-publish push origin main
          fi
      - name: Deploy prebuilt website and functions to Netlify
        working-directory: website-publish
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          pnpm --package=netlify-cli@27.13.0 dlx netlify deploy \
            --prod \
            --no-build \
            --filter @axolotl/website \
            --dir "$PWD/apps/website/.output/public" \
            --functions "$PWD/netlify/functions" \
            --site "$NETLIFY_SITE_ID" \
            --message "Launcher ${GITHUB_REF_NAME} (GitHub Actions ${GITHUB_RUN_ID})" \
            --timeout 600

  mirror-cnb:
    needs: verify-and-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release-metadata
          path: release-check
      - name: Mirror published release to CNB
        env:
          CNB_REPO_URL_HTTPS: ${{ secrets.CNB_REPO_URL_HTTPS }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_TOKEN_USER_NAME: ${{ secrets.CNB_TOKEN_USER_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "CNB_TOKEN is not configured"
            exit 1
          fi

          cnb_url="${CNB_REPO_URL_HTTPS:-https://cnb.cool/axlmc/Axolotl.git}"
          token_user="${CNB_TOKEN_USER_NAME:-cnb}"
          auth="$(printf '%s:%s' "$token_user" "$CNB_TOKEN" | base64 -w0)"
          git_cnb() {
            git -c "http.extraHeader=Authorization: Basic $auth" "$@"
          }

          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git_cnb push --force "$cnb_url" \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

          node scripts/axolotl/cnb-release.mjs finalize "${GITHUB_REF_NAME}" cnb-release/final
          node scripts/axolotl/verify-update-manifest.mjs \
            cnb-release/final/latest.json "${GITHUB_REF_NAME}" cnb
