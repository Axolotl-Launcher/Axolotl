name: Deploy website to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: website-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Check Cloudflare Pages deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]]; then
            echo '::error::Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the CLOUDFLARE_PAGES_PROJECT_NAME variable. See apps/website/README.md.'
            exit 1
          fi
      - name: Check out current production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile --filter @axolotl/website...
      - name: Generate static website on GitHub
        run: pnpm --filter @axolotl/website build
      - name: Verify prerendered website
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          assert(fs.existsSync('apps/website/.output/public/index.html'), 'Missing website homepage')
          const catalog = JSON.parse(fs.readFileSync('apps/website/releases/catalog.json', 'utf8'))
          assert(catalog.announcements.length > 0, 'Empty release catalog')
          const html = fs.readFileSync('apps/website/.output/public/changelog/index.html', 'utf8')
          for (const entry of catalog.announcements) {
            assert(html.includes(entry.version), `Release ${entry.version} was not prerendered`)
          }
          NODE
      - name: Save static website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-static-manual
          path: apps/website/.output/public/
          retention-days: 7
          if-no-files-found: error
      - name: Deploy prebuilt website to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --package=wrangler@4.152.0 dlx wrangler pages deploy \
            apps/website/.output/public \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main \
            --commit-message "Manual website deploy (GitHub Actions ${GITHUB_RUN_ID})"
