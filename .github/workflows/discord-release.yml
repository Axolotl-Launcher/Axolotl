name: Notify Discord release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      DISCORD_BOT_TOKEN:
        required: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to notify (safe to retry)'
        required: true
        type: string
      dry-run:
        description: 'Preview messages in logs without contacting Discord'
        default: true
        type: boolean

permissions:
  contents: read

env:
  DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '1562330646746234911' }}

concurrency:
  group: discord-release-${{ github.repository }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check Discord configuration
        id: config
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -z "$DISCORD_BOT_TOKEN" ]]; then
            echo '::notice::Discord notifications are disabled. Configure the DISCORD_BOT_TOKEN repository secret; see CONTRIBUTING.md.'
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout notification scripts and release tags
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Send bilingual notes and installers
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAX_UPLOAD_MIB: ${{ vars.DISCORD_MAX_UPLOAD_MIB || '20' }}
          DISCORD_NOTIFY_ROLE_ID: ${{ vars.DISCORD_NOTIFY_ROLE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          node scripts/axolotl/publish-discord-release.mjs "$RELEASE_TAG" "${args[@]}"
