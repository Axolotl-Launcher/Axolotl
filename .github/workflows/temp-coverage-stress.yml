name: TEMP coverage stress

# TEMPORARY: verifies that the endpoint-selection probe tests are stable under
# instrumentation on Linux before this branch is merged. Delete this file once
# the result is recorded; it is not meant to live on main.
#
# Why it exists: the probe tests pass on a single run even when they are flaky,
# so one green coverage job proves nothing. This runs the two H2 recovery tests
# many times against one instrumented build and reports the pass rate.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Iterations per test
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  stress:
    name: Stress probe tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      SQLX_OFFLINE: true
      RUST_MIN_STACK: 67108864
      RUNS: ${{ github.event.inputs.runs || '30' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # `setup-desktop-build` downloads the `desktop-resources` artifact, which
      # only the main CI workflow produces. This workflow runs on its own, so it
      # installs the toolchain and native dependencies directly instead.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain="$(node -e 'const fs=require("node:fs");const s=fs.readFileSync("rust-toolchain.toml","utf8");process.stdout.write(s.match(/^channel\s*=\s*"([^"]+)"/m)[1])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
      - name: Install Linux linker
        uses: ./.github/actions/setup-mold
      - name: Restore dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: temp-probe-stress
          cache-on-failure: true
          cache-bin: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::ForceIPv4=true install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The Java jars live in a build output, so `theseus`' build script builds
      # them with the runner's JDK when no prepared resource bundle is given.
      - name: Verify the runner JDK
        shell: bash
        run: |
          java -version
          test -n "${JAVA_HOME:-}" || echo 'JAVA_HOME is unset; gradlew resolves java from PATH'
      - name: Install coverage tools
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.150
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      # Build the instrumented test binary once, then run it in a loop: the
      # point is to repeat the tests, not to repeat a 30-minute build.
      #
      # `cargo llvm-cov` owns the target directory and ignores an outer
      # `CARGO_LLVM_COV_TARGET_DIR` in `--no-report` mode, so the build is
      # driven through the tool itself: the first iteration runs under
      # `cargo llvm-cov test`, which produces the instrumented binary in the
      # directory the tool actually chose.
      - name: First instrumented run
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov test -p theseus --lib --no-report --locked --no-fail-fast \
            util::download::endpoint_selection::probe::tests::native_h2_
      - name: Locate the test binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          # Ask the tool where it built, rather than assuming a layout. The
          # value is quoted with single quotes by `show-env`; fall back to the
          # documented default if the format ever changes.
          target_dir="$(cargo llvm-cov show-env --sh \
            | sed -n "s/^export CARGO_LLVM_COV_TARGET_DIR='\(.*\)'$/\1/p" | head -n 1)"
          if [ -z "$target_dir" ]; then
            target_dir="$PWD/target"
            echo "show-env gave no target directory; using $target_dir"
          fi
          deps="$target_dir/debug/deps"
          test -d "$deps" || { echo "no coverage deps directory at $deps" >&2; exit 1; }
          # The test binary is `theseus-<hash>` on Unix and `.exe` on Windows.
          # Test executability only on Unix: under Git Bash the bit is not a
          # reliable signal for a `.exe`, and `-x` then rejects every candidate.
          binary=""
          newest=0
          for candidate in "$deps"/theseus-*; do
            case "$candidate" in
              *.d|*.rlib|*.rmeta|*.pdb|*.dll) continue ;;
            esac
            [ -f "$candidate" ] || continue
            if [ "$RUNNER_OS" != "Windows" ] && [ ! -x "$candidate" ]; then
              continue
            fi
            stamp="$(stat -c %Y "$candidate" 2>/dev/null || stat -f %m "$candidate" 2>/dev/null || echo 0)"
            if [ "$stamp" -ge "$newest" ]; then
              newest="$stamp"
              binary="$candidate"
            fi
          done
          if [ -z "$binary" ]; then
            echo "No instrumented theseus test binary under $deps" >&2
            ls -la "$deps" | grep -i theseus | head -20 >&2 || true
            exit 1
          fi
          echo "path=$binary" >> "$GITHUB_OUTPUT"
          echo "Using $binary"
      - name: Stress single-stream recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          binary="${{ steps.binary.outputs.path }}"
          pass=0; fail=0
          for i in $(seq 1 "$RUNS"); do
            if "$binary" --exact \
              util::download::endpoint_selection::probe::tests::native_h2_single_stream_measures_new_peer_and_resumes_verified_file \
              --test-threads=1 > "stress-single-$i.log" 2>&1
            then pass=$((pass + 1)); else fail=$((fail + 1)); fi
          done
          echo "native_h2_single_stream: $pass passed, $fail failed of $RUNS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "single-stream pass=$pass fail=$fail"
          [ "$fail" -eq 0 ]
      - name: Stress ranged recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          binary="${{ steps.binary.outputs.path }}"
          pass=0; fail=0
          for i in $(seq 1 "$RUNS"); do
            if "$binary" --exact \
              util::download::endpoint_selection::probe::tests::native_h2_ranges_measure_new_peer_and_resume_verified_file \
              --test-threads=1 > "stress-ranges-$i.log" 2>&1
            then pass=$((pass + 1)); else fail=$((fail + 1)); fi
          done
          echo "native_h2_ranges: $pass passed, $fail failed of $RUNS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ranges pass=$pass fail=$fail"
          [ "$fail" -eq 0 ]
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-logs-${{ matrix.os }}
          path: stress-*.log
          retention-days: 3
          if-no-files-found: ignore
