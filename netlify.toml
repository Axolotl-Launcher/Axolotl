# 网站由 GitHub Actions 构建，通过 netlify deploy --no-build 上传静态产物和 Functions。
# 请在 Netlify 后台设置 Stopped builds，避免 Git 推送触发重复构建。
# 首次部署配置见 apps/website/README.md。
#
# 以下 /api/* 由 Netlify Functions 实时转发 CNB 数据（客户端直连 CNB 会被
# CORS 拦截，见 netlify/functions/releases-*.mjs）。

[[redirects]]
from = "/api/releases/latest"
to = "/.netlify/functions/releases-latest"
status = 200

[[redirects]]
from = "/api/releases/miawa"
to = "/.netlify/functions/releases-miawa"
status = 200

[[redirects]]
from = "/api/downloads/prepare"
to = "/.netlify/functions/downloads-prepare"
status = 200
