[package]
name = "theseus"
# The actual version is set by the theseus-build workflow on tagging
version = "1.10.0"
edition.workspace = true

[dependencies]
ariadne = { workspace = true }
async-minecraft-ping = { workspace = true, features = ["srv"] }
async-recursion = { workspace = true }
async-trait = { workspace = true }
async-tungstenite = { workspace = true, features = [
  "tokio-runtime",
  "tokio-rustls-webpki-roots"
] }
async-walkdir = { workspace = true }
async_zip = { workspace = true, features = [
  "bzip2",
  "chrono",
  "deflate",
  "deflate64",
  "tokio-fs",
  "zstd",
] }
base64 = { workspace = true }
bon = { workspace = true }
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
bytes = { workspace = true, features = ["serde"] }
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
chardetng = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
content-management = { workspace = true }
crc32fast = { workspace = true }
daedalus = { workspace = true }
dashmap = { workspace = true, features = ["serde"] }
data-url = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
dirs = { workspace = true }
discord-rich-presence = { workspace = true }
dunce = { workspace = true }
either = { workspace = true }
encoding_rs = { workspace = true }
enumset = { workspace = true }
eyre = { workspace = true }
flate2 = { workspace = true }
fs4 = { workspace = true, features = ["tokio"] }
futures = { workspace = true, features = ["alloc", "async-await"] }
futures-lite = { workspace = true }
h2 = { workspace = true }
heck = { workspace = true }
hickory-resolver = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
indicatif = { workspace = true, optional = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
local-ip-address = { workspace = true }
md5 = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
parking_lot = { workspace = true }
paste = { workspace = true }
path-util = { workspace = true }
phf = { workspace = true }
png = { workspace = true }
portable-pty = { workspace = true }
quartz_nbt = { workspace = true, features = ["serde"] }
quick-xml = { workspace = true, features = ["async-tokio", "serialize"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = [
  "brotli",
  "charset",
  "deflate",
  "gzip",
  "http2",
  "json",
  "macos-system-configuration",
  "multipart",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
  "socks",
  "stream",
] }
rgb = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_cbor = { workspace = true }
serde_ini = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
socket2 = { workspace = true }
sqlx = { workspace = true, features = [
  "json",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
  "uuid",
] }
symlink-rs = { workspace = true }
sysinfo = { workspace = true, features = ["disk", "system"] }
tar = { workspace = true }
tauri = { workspace = true, features = ["unstable"], optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
  "time",
] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = [
  "compat",
  "io",
  "io-util",
  "rt",
  "time"
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true, features = ["chrono", "env-filter"] }
unicode-normalization = { workspace = true }
url = { workspace = true, features = ["serde"] }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
webpki-roots = { workspace = true }
whoami = { workspace = true }
xz2 = { workspace = true }
zbus = { workspace = true }
zhconv = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
chrono-tz = "0.10.4"
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }

[build-dependencies]
dotenvy = { workspace = true }
dunce = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { workspace = true, features = ["blocks", "nw"] }
libc = { workspace = true }

[target."cfg(windows)".dependencies]
junction = { workspace = true }
windows = { workspace = true, features = [
  "Networking_Connectivity",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
windows-core = { workspace = true }
winreg = { workspace = true }

[features]
cli = ["dep:indicatif"]
tauri = ["dep:tauri"]

[lints]
workspace = true
